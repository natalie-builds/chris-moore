<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In Memory of Chris Moore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f8f5f0;
      color: #2a2118;
      font-family: Georgia, serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 48px 24px 40px;
      border-bottom: 1px solid #e5ddd4;
    }

    .celebrating {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a09080;
      margin-bottom: 20px;
      font-style: normal;
    }

    .portrait {
      width: 220px;
      height: 280px;
      border-radius: 12px;
      object-fit: cover;
      object-position: center 10%;
      margin-bottom: 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      color: #1a150f;
      margin-bottom: 12px;
    }

    header p {
      font-size: 1rem;
      color: #8a7968;
      font-style: italic;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* Upload section */
    .upload-section {
      text-align: center;
      padding: 20px 24px;
      border-bottom: 1px solid #e5ddd4;
    }

    .upload-area {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .upload-area input[type="file"] { display: none; }

    .upload-btn {
      background: #5a4a38;
      color: #f8f5f0;
      border: none;
      padding: 9px 22px;
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-btn:hover { background: #3d3125; }
    .upload-btn:disabled { background: #c8b89a; cursor: not-allowed; }

    .upload-hint {
      font-size: 0.8rem;
      color: #a09080;
      font-style: italic;
    }

    /* Caption input — shown after file is selected */
    .caption-row {
      display: none;
      max-width: 480px;
      margin: 16px auto 0;
      text-align: left;
    }

    .caption-row.visible { display: block; }

    .caption-row label {
      display: block;
      font-size: 0.8rem;
      color: #8a7968;
      margin-bottom: 6px;
      font-style: italic;
    }

    .caption-row input {
      width: 100%;
      border: 1px solid #d8cfc4;
      border-radius: 6px;
      padding: 9px 12px;
      font-family: Georgia, serif;
      font-size: 0.9rem;
      color: #2a2118;
      background: #fff;
      outline: none;
    }

    .caption-row input:focus { border-color: #8a7968; }

    .caption-submit {
      margin-top: 10px;
      background: #5a4a38;
      color: #f8f5f0;
      border: none;
      padding: 9px 24px;
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .caption-submit:hover { background: #3d3125; }

    .status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #8a7968;
      font-style: italic;
      min-height: 20px;
      text-align: center;
    }

    /* Gallery */
    .gallery-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .gallery-section h2 {
      font-size: 0.75rem;
      font-weight: normal;
      color: #8a7968;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
      text-align: center;
    }

    .gallery {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 24px 8px;
    }

    .gallery-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    @media (max-width: 700px) { .gallery { flex-wrap: wrap; } .gallery-col { min-width: 45%; } }
    @media (max-width: 460px) { .gallery-col { min-width: 100%; } }

    .photo-wrap {
      margin-bottom: 24px;
      margin-top: 16px;
      width: 92%;
      align-self: center;
      background: #fff;
      padding: 10px 10px 36px;
      box-shadow: 3px 6px 20px rgba(0,0,0,0.18), 0 1px 4px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      border: 1px solid #e8e0d8;
      position: relative;
    }

    .photo-wrap:hover {
      box-shadow: 6px 10px 32px rgba(0,0,0,0.22);
      z-index: 10;
    }

    .photo-wrap img {
      width: 100%;
      display: block;
    }

    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 10px 10px;
      font-size: 0.78rem;
      color: #8a7968;
      font-style: italic;
      text-align: center;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      text-align: center;
      color: #c8b89a;
      font-style: italic;
      font-size: 0.95rem;
      padding: 40px 0;
      width: 100%;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-caption {
      color: #ccc;
      font-style: italic;
      font-size: 0.9rem;
      margin-top: 16px;
      text-align: center;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
    }

    .lightbox-close:hover { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <p class="celebrating">Celebrating the life of</p>
    <img class="portrait" src="chris.png" alt="Chris Moore" />
    <h1>Chris Moore</h1>
    <p>Share your memories of Chris — every picture is a gift to the family.</p>
  </header>

  <div class="upload-section">
    <h2>Add a photo</h2>
    <label class="upload-area" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" />
      <button class="upload-btn" id="uploadBtn" type="button">Choose Photo</button>
      <span class="upload-hint">or drag and drop · any device, any format</span>
    </label>
    <div class="caption-row" id="captionRow">
      <label for="captionInput">Add a caption (optional) — when was this taken, what's the memory?</label>
      <input type="text" id="captionInput" placeholder="e.g. Christmas 2019, at the lake house" maxlength="120" />
      <button class="caption-submit" id="submitBtn">Upload</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="gallery-section">
    <h2>Photos</h2>
    <div class="gallery" id="gallery">
      <div class="empty">Photos shared by family and friends will appear here.</div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img id="lightboxImg" src="" alt="" />
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const submitBtn = document.getElementById('submitBtn');
    const captionRow = document.getElementById('captionRow');
    const captionInput = document.getElementById('captionInput');
    const dropzone = document.getElementById('dropzone');
    const status = document.getElementById('status');
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');

    let pendingFile = null;

    loadPhotos();

    async function loadPhotos() {
      try {
        const res = await fetch('/photos');
        const photos = await res.json();
        renderGallery(photos);
      } catch (e) {}
    }

    function renderGallery(photos) {
      if (!photos.length) {
        gallery.innerHTML = '<div class="empty">Photos shared by family and friends will appear here.</div>';
        return;
      }
      const cols = [[], [], [], [], []];
      photos.forEach((p, i) => cols[i % 5].push(p));
      gallery.innerHTML = cols.map(colPhotos => `
        <div class="gallery-col">
          ${colPhotos.map(p => {
            const rot = (Math.random() * 14 - 7).toFixed(2);
            return `<div class="photo-wrap" style="transform: rotate(${rot}deg)" data-caption="${(p.caption || '').replace(/"/g, '&quot;')}">
              <img src="/photo/${p.key}" loading="lazy" alt="Memory of Chris" />
              ${p.caption ? `<div class="photo-caption">${p.caption}</div>` : ''}
            </div>`;
          }).join('')}
        </div>
      `).join('');
      gallery.querySelectorAll('.photo-wrap').forEach(wrap => {
        wrap.addEventListener('click', () => {
          lightboxImg.src = wrap.querySelector('img').src;
          lightboxCaption.textContent = wrap.dataset.caption || '';
          lightbox.classList.add('open');
        });
      });
    }

    // File selection — show caption field
    uploadBtn.addEventListener('click', (e) => { e.preventDefault(); fileInput.click(); });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) {
        pendingFile = fileInput.files[0];
        captionRow.classList.add('visible');
        captionInput.focus();
        status.textContent = '';
      }
    });

    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.background = '#ede8e0'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.background = ''; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.background = '';
      if (e.dataTransfer.files[0]) {
        pendingFile = e.dataTransfer.files[0];
        captionRow.classList.add('visible');
        captionInput.focus();
      }
    });

    // Submit upload
    submitBtn.addEventListener('click', doUpload);
    captionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doUpload(); });

    async function doUpload() {
      if (!pendingFile) return;
      submitBtn.disabled = true;
      status.textContent = 'Uploading...';
      const form = new FormData();
      form.append('photo', pendingFile);
      form.append('caption', captionInput.value.trim());
      try {
        await fetch('/upload', { method: 'POST', body: form });
        status.textContent = 'Photo uploaded. Thank you.';
        captionRow.classList.remove('visible');
        captionInput.value = '';
        fileInput.value = '';
        pendingFile = null;
        loadPhotos();
      } catch (e) {
        status.textContent = 'Something went wrong. Please try again.';
      }
      submitBtn.disabled = false;
    }

    // Lightbox
    document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('open'));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });
  </script>

</body>
</html>
