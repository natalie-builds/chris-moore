<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In Memory of Chris Moore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f8f5f0;
      color: #2a2118;
      font-family: Georgia, serif;
      min-height: 100vh;
    }

    header {
      padding: 28px 32px;
      border-bottom: 1px solid #e5ddd4;
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 28px;
      max-width: 620px;
      margin: 0 auto;
    }

    .celebrating {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a09080;
      margin-bottom: 8px;
      font-style: normal;
    }

    .portrait {
      width: 130px;
      height: 165px;
      border-radius: 10px;
      object-fit: cover;
      object-position: center 10%;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .header-text { text-align: left; }

    header h1 {
      font-size: 1.9rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      color: #1a150f;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.9rem;
      color: #8a7968;
      font-style: italic;
      line-height: 1.7;
    }

    /* Upload section */
    .upload-section {
      text-align: center;
      padding: 20px 24px;
      border-bottom: 1px solid #e5ddd4;
    }

    .upload-area {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .upload-area input[type="file"] { display: none; }

    .upload-icon {
      font-size: 1.3rem;
      color: #a09080;
    }

    .upload-text {
      font-size: 0.8rem;
      color: #a09080;
      font-style: italic;
      line-height: 1.5;
      text-align: left;
    }

    .upload-btn {
      background: #5a4a38;
      color: #f8f5f0;
      border: none;
      padding: 9px 22px;
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .upload-btn:hover { background: #3d3125; }
    .upload-btn:disabled { background: #c8b89a; cursor: not-allowed; }

    /* Pending photos list */
    .pending-list {
      max-width: 520px;
      margin: 16px auto 0;
    }

    .pending-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #ede8e0;
      text-align: left;
    }

    .pending-thumb {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .pending-details {
      flex: 1;
      min-width: 0;
    }

    .pending-name {
      font-size: 0.72rem;
      color: #a09080;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pending-caption-input {
      width: 100%;
      border: 1px solid #d8cfc4;
      border-radius: 5px;
      padding: 6px 10px;
      font-family: Georgia, serif;
      font-size: 0.85rem;
      color: #2a2118;
      background: #fff;
      outline: none;
    }

    .pending-caption-input:focus { border-color: #8a7968; }

    .pending-remove {
      background: none;
      border: none;
      color: #c8b89a;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 6px;
      flex-shrink: 0;
      line-height: 1;
    }

    .pending-remove:hover { color: #8a7968; }

    .caption-submit {
      background: #5a4a38;
      color: #f8f5f0;
      border: none;
      padding: 9px 24px;
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .caption-submit:hover { background: #3d3125; }
    .caption-submit:disabled { background: #c8b89a; cursor: not-allowed; }

    .status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #8a7968;
      font-style: italic;
      min-height: 20px;
      text-align: center;
    }

    /* Gallery */
    .gallery-section {
      padding: 28px 8px 60px;
    }

    .gallery-section h2 {
      font-size: 0.75rem;
      font-weight: normal;
      color: #8a7968;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
    }

    .gallery {
      display: flex;
      gap: 4px;
      align-items: flex-start;
      padding: 8px 4px;
    }

    .gallery-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    @media (max-width: 700px) { .gallery { flex-wrap: wrap; } .gallery-col { min-width: 45%; } }
    @media (max-width: 460px) { .gallery-col { min-width: 100%; } }

    .photo-wrap {
      margin-bottom: 12px;
      margin-top: 8px;
      width: 94%;
      align-self: center;
      background: #fff;
      padding: 10px 10px 14px;
      box-shadow: 3px 6px 20px rgba(0,0,0,0.18), 0 1px 4px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      border: 1px solid #e8e0d8;
    }

    .photo-wrap:hover {
      box-shadow: 6px 10px 32px rgba(0,0,0,0.22);
      z-index: 10;
    }

    .photo-wrap img {
      width: 100%;
      display: block;
    }

    .photo-caption {
      padding: 7px 4px 0;
      font-size: 0.7rem;
      color: #8a7968;
      font-style: italic;
      text-align: center;
      line-height: 1.4;
    }

    .empty {
      text-align: center;
      color: #c8b89a;
      font-style: italic;
      font-size: 0.95rem;
      padding: 40px 0;
      width: 100%;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-caption {
      color: #ccc;
      font-style: italic;
      font-size: 0.9rem;
      margin-top: 16px;
      text-align: center;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 24px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
    }

    .lightbox-close:hover { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <img class="portrait" src="chris.png" alt="Chris Moore" />
      <div class="header-text">
        <p class="celebrating">Celebrating the life of</p>
        <h1>Chris Moore</h1>
        <p style="white-space: nowrap;">Share your memories of Chris — every picture is a gift to the family.</p>
      </div>
    </div>
  </header>

  <div class="upload-section">
    <h2>Add photos</h2>
    <div class="upload-area" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" multiple />
      <div class="upload-icon">☁</div>
      <div class="upload-text">Click to choose photos, or drag and drop here.<br>Any device, any format.</div>
      <button class="upload-btn" id="uploadBtn" type="button">Choose Photos</button>
    </div>
    <div class="pending-list" id="pendingList"></div>
    <div id="submitRow" style="display:none; margin-top:14px;">
      <button class="caption-submit" id="submitBtn">Upload</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="gallery-section">
    <h2>Photos</h2>
    <div class="gallery" id="gallery">
      <div class="empty">Photos shared by family and friends will appear here.</div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img id="lightboxImg" src="" alt="" />
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const submitBtn = document.getElementById('submitBtn');
    const submitRow = document.getElementById('submitRow');
    const pendingList = document.getElementById('pendingList');
    const dropzone = document.getElementById('dropzone');
    const status = document.getElementById('status');
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');

    let pendingFiles = [];

    loadPhotos();

    async function loadPhotos() {
      try {
        const res = await fetch('/photos');
        const photos = await res.json();
        renderGallery(photos);
      } catch (e) {}
    }

    function keyRotation(key) {
      let h = 0;
      for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) & 0xffffffff;
      return (((h >>> 0) % 1400) / 100 - 7).toFixed(2);
    }

    function renderGallery(photos) {
      if (!photos.length) {
        gallery.innerHTML = '<div class="empty">Photos shared by family and friends will appear here.</div>';
        return;
      }
      const cols = [[], [], [], [], []];
      photos.forEach((p, i) => cols[i % 5].push(p));
      gallery.innerHTML = cols.map(colPhotos => `
        <div class="gallery-col">
          ${colPhotos.map(p => {
            const rot = keyRotation(p.key);
            return `<div class="photo-wrap" style="transform: rotate(${rot}deg)" data-caption="${(p.caption || '').replace(/"/g, '&quot;')}">
              <img src="/photo/${p.key}" loading="lazy" alt="Memory of Chris" />
              ${p.caption ? `<div class="photo-caption">${p.caption}</div>` : ''}
            </div>`;
          }).join('')}
        </div>
      `).join('');
      gallery.querySelectorAll('.photo-wrap').forEach(wrap => {
        wrap.addEventListener('click', () => {
          lightboxImg.src = wrap.querySelector('img').src;
          lightboxCaption.textContent = wrap.dataset.caption || '';
          lightbox.classList.add('open');
        });
      });
    }

    // File selection
    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files);
      if (!files.length) return;
      pendingFiles.forEach(item => URL.revokeObjectURL(item.url));
      pendingFiles = files.map(f => ({ file: f, caption: '', url: URL.createObjectURL(f) }));
      renderPendingList();
      status.textContent = '';
    });

    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.background = '#ede8e0'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.background = ''; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.background = '';
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      if (!files.length) return;
      pendingFiles.forEach(item => URL.revokeObjectURL(item.url));
      pendingFiles = files.map(f => ({ file: f, caption: '', url: URL.createObjectURL(f) }));
      renderPendingList();
    });

    function renderPendingList() {
      if (!pendingFiles.length) {
        pendingList.innerHTML = '';
        submitRow.style.display = 'none';
        return;
      }
      pendingList.innerHTML = pendingFiles.map((item, i) => `
        <div class="pending-item">
          <img class="pending-thumb" src="${item.url}" alt="" />
          <div class="pending-details">
            <div class="pending-name">${item.file.name}</div>
            <input class="pending-caption-input" type="text" placeholder="Add a caption (optional)" maxlength="120" data-index="${i}" />
          </div>
          <button class="pending-remove" data-index="${i}">✕</button>
        </div>
      `).join('');

      pendingList.querySelectorAll('.pending-caption-input').forEach(input => {
        input.addEventListener('input', () => {
          pendingFiles[parseInt(input.dataset.index)].caption = input.value;
        });
      });

      pendingList.querySelectorAll('.pending-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = parseInt(btn.dataset.index);
          URL.revokeObjectURL(pendingFiles[i].url);
          pendingFiles.splice(i, 1);
          if (!pendingFiles.length) fileInput.value = '';
          renderPendingList();
        });
      });

      submitRow.style.display = 'block';
    }

    // Submit upload
    submitBtn.addEventListener('click', doUpload);

    async function doUpload() {
      if (!pendingFiles.length) return;
      submitBtn.disabled = true;
      const total = pendingFiles.length;
      try {
        for (let i = 0; i < pendingFiles.length; i++) {
          status.textContent = total > 1 ? `Uploading ${i + 1} of ${total}...` : 'Uploading...';
          const form = new FormData();
          form.append('photo', pendingFiles[i].file);
          form.append('caption', pendingFiles[i].caption.trim());
          await fetch('/upload', { method: 'POST', body: form });
        }
        pendingFiles.forEach(item => URL.revokeObjectURL(item.url));
        pendingFiles = [];
        pendingList.innerHTML = '';
        fileInput.value = '';
        submitRow.style.display = 'none';
        status.textContent = `${total} photo${total > 1 ? 's' : ''} uploaded. Thank you.`;
        loadPhotos();
      } catch (e) {
        status.textContent = 'Something went wrong. Please try again.';
        submitBtn.disabled = false;
      }
    }

    // Lightbox
    document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('open'));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });
  </script>

</body>
</html>
